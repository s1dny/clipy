name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What production runs, built on azalab-1's runner, whose store is the cache both hosts
  # deploy from; the homelab moves its pin to a commit once this passes.
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: host
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build what production runs
        run: nix --extra-experimental-features 'nix-command flakes' build "path:$PWD#default" --no-link
