name: CI

# Runs on azalab-0. Flux deploys each image this publishes; an image is only
# published from a main commit whose checks passed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q tests

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$REGISTRY_TOKEN" | docker login git.aza.network --username aiden --password-stdin
          image="git.aza.network/aza/clipy:main-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          docker build --tag "$image" .
          docker push "$image"
