name: Deliver

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clipy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: host
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test, publish and verify production within five minutes
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          CLIPY_RELEASE_URL: http://10.43.100.200:8000/releasez
        run: bash scripts/deliver.sh
