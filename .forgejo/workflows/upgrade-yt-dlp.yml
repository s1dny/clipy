name: upgrade yt-dlp

# YouTube breaks old yt-dlp releases within weeks, and the channels run
# unattended, so pick up new releases daily and ship them through CI.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      # A push made with the job's own token does not start workflows; one
      # made with this token does, so the upgrade goes through CI like any
      # other commit.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Pin the latest release and its checksum
        run: |
          version=$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -er .tag_name)
          checksum=$(curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/$version/SHA2-256SUMS" \
            | awk '$2 == "yt-dlp_linux" { print $1 }')
          [ ${#checksum} -eq 64 ]
          sed -i "s/^ARG YT_DLP_VERSION=.*/ARG YT_DLP_VERSION=$version/; s/^ARG YT_DLP_SHA256=.*/ARG YT_DLP_SHA256=$checksum/" Dockerfile
      - name: Commit and deploy
        run: |
          git diff --quiet Dockerfile && exit 0
          git config user.name "azalab-0"
          git config user.email "azalab-0@aza.network"
          git commit -am "chore: upgrade yt-dlp"
          git push
