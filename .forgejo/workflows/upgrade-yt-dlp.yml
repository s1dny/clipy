name: upgrade yt-dlp

# YouTube breaks old yt-dlp releases within weeks, and the channel runs
# unattended, so pick up new releases daily and ship them through CI.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      # A push made with the job's own token does not start workflows; one
      # made with this token does, so the upgrade goes through CI like any
      # other commit.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - name: uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv lock --upgrade-package yt-dlp
      - name: Commit and deploy
        run: |
          git diff --quiet uv.lock && exit 0
          git config user.name "azalab-0"
          git config user.email "azalab-0@aza.network"
          git commit -am "chore: upgrade yt-dlp"
          git push
