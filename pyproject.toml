[project]
name = "clipper"
version = "1.0.0"
description = "Clipper: The YouTube Automator - Downloads videos, extracts clips, generates thumbnails and uploads all automatically"
requires-python = ">=3.14"
dependencies = [
    "assemblyai>=0.59.0",
    "colorlog>=6.10.1",
    "google-api-python-client>=2.193.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "numpy>=2.2.6",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "tqdm>=4.67.3",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
