[project]
name = "clipy"
version = "1.0.0"
description = "Clipy: a fully autonomous YouTube clip channel run by an AI agent"
requires-python = ">=3.15"
dependencies = [
    "assemblyai>=1.6.5",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "markdown>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "yt-dlp[curl-cffi,default]>=2026.10.21",
]

[project.scripts]
clipy = "clipy.cli:main"
clipy-mcp = "clipy.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-n 4 --dist loadgroup"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]
