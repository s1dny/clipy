[project]
name = "clipper"
version = "1.0.0"
description = "Clipper: The YouTube Automator - Downloads videos, extracts clips, generates thumbnails and uploads all automatically"
requires-python = ">=3.14"
dependencies = [
    "assemblyai>=1.0.0",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "mcp>=1.20",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
clipper = "clipper.cli:main"
clipper-mcp = "clipper.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
