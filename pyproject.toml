[project]
name = "yt-clip-automation"
version = "1.0.0"
description = "YouTube Clip Automation Script - Downloads video, transcribes, extracts clips via LLM, generates thumbnails"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.1.1",
    "assemblyai>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
managed = true
