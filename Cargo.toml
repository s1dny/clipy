[package]
name = "clipy"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "A fully autonomous YouTube clip channel run by an AI agent"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18.2"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2.32"
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled", "serde_json"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = { version = "1.1.8", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = "0.14.10"
rmcp = { version = "3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
rustls = "0.23.46"
tempfile = "3"
tokio-rustls = "0.26.6"

[profile.release]
incremental = true
